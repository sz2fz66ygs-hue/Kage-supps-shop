<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kage Supps</title>
  <link rel="stylesheet" href="/shop.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="/store">KAGE</a>
      <nav class="nav" id="nav"></nav>
      <a class="basket-btn" href="#checkout">Basket <span id="cartCount">0</span></a>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Kage Supps</h1>
      <p>Premium compounds · Crypto only</p>
    </div>
  </section>

  <div class="wrap">
    <input id="search" class="search" type="search" placeholder="Search">
    <div id="sections"></div>
  </div>

  <section id="checkout" class="checkout">
    <div class="wrap narrow">
      <h2>Checkout</h2>
      <div id="basketLines" class="lines"></div>
      <p class="total">Total <strong id="basketTotal">£0.00</strong></p>
      <input id="name" placeholder="Full name">
      <input id="phone" placeholder="Phone">
      <textarea id="address" placeholder="Delivery address"></textarea>
      <button id="place" class="btn" type="button">Place order</button>
      <p id="status" class="status"></p>
    </div>
  </section>
  <script src="/shop.js"></script>
</body>
</html>
