<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Add products · Kage Supps</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/logo.png" alt=""><span>KAGE SUPPS</span></div>
  </header>
  <main>
    <section class="checkout-card">
      <div class="eyebrow">ADMIN</div>
      <h2>Add a product</h2>
      <form id="login">
        <label>Telegram username</label>
        <input id="handle" placeholder="@username">
        <button class="gold-btn" type="button" id="requestCode">Send code</button>
        <label>Code</label>
        <input id="code" placeholder="6 digit code">
        <button class="gold-btn" type="button" id="verifyCode">Log in</button>
      </form>
      <p id="message" class="status"></p>
      <div id="tools" hidden>
        <h2>Paste products</h2>
        <p>One product per line.</p>
        <p><code>Name | Category | Price | Strength</code></p>
        <textarea id="bulk" rows="8" placeholder="Daily multivitamin | General | 12 | 30 tablets"></textarea>
        <button class="gold-btn" id="bulkAdd" type="button">Add pasted products</button>
        <h2>Or add one</h2>
        <form id="add">
          <label>Name</label>
          <input id="name" required>
          <label>Category</label>
          <input id="category" required>
          <label>Strength</label>
          <input id="strength" placeholder="10mg">
          <label>Price (£)</label>
          <input id="price" type="number" min="0" step="0.01" required>
          <label>Description</label>
          <textarea id="description"></textarea>
          <button class="gold-btn" type="submit">Add product</button>
        </form>
        <div id="list"></div>
      </div>
    </section>
  </main>
  <script src="/manage.js"></script>
</body>
</html>
