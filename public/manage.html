<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Add products · Kage Supps</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="account">
    <p class="eyebrow">Admin</p>
    <h1>Add a product</h1>
    <form id="login">
      <label>Telegram username<input id="handle" placeholder="@username"></label>
      <button class="btn" type="button" id="requestCode">Send code</button>
      <label>Code<input id="code" placeholder="6 digit code"></label>
      <button class="btn" type="button" id="verifyCode">Log in</button>
      <p id="message"></p>
    </form>
    <form id="add" hidden>
      <h2>Paste products</h2>
      <p>One product per line. Use <code>Name | Category | Price | Strength</code> or <code>Name 10mg 20</code>.</p>
      <textarea id="bulk" rows="8" placeholder="Example product | General | 20 | 10mg"></textarea>
      <button class="btn" id="bulkAdd" type="button">Add pasted products</button>
      <h2>Or add one</h2>
      <label>Name<input id="name" required></label>
      <label>Category<input id="category" required></label>
      <label>Strength<input id="strength" placeholder="10mg"></label>
      <label>Price (£)<input id="price" type="number" min="0" step="0.01" required></label>
      <label>Description<textarea id="description"></textarea></label>
      <button class="btn" type="submit">Add product</button>
    </form>
    <div id="list"></div>
  </main>
  <script src="/manage.js"></script>
</body>
</html>
