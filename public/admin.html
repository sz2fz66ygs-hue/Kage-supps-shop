<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Admin · Kage Supps</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .tabs{position:sticky;top:63px}
    .panel{display:none}
    .panel.active{display:block}
    .slip{margin:12px 16px;padding:16px;border:1px solid #e9e4d7;border-radius:18px;background:#fff}
    .items{display:flex;flex-direction:column;gap:8px;margin:14px 0}
    .items label{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #e9e4d7;border-radius:14px;background:#fbfaf7}
    .items label:has(input:checked){background:#f7f0dc;border-color:#daa520}
    .done{opacity:.55;text-decoration:line-through}
    pre{white-space:pre-wrap;font:inherit}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/logo.png" alt=""><span>KAGE SUPPS</span></div>
    <span id="progress"></span>
  </header>
  <nav class="tabs" id="adminTabs" hidden>
    <button class="tab active" data-panel="pack" type="button">Packing</button>
    <button class="tab" data-panel="products" type="button">Products</button>
  </nav>
  <main>
    <section class="checkout-card" id="login">
      <div class="eyebrow">ADMIN</div>
      <h2>Sign in</h2>
      <label>Telegram username</label>
      <input id="handle" placeholder="@username">
      <button class="gold-btn" type="button" id="requestCode">Send code</button>
      <label>Code</label>
      <input id="code" placeholder="6 digit code">
      <button class="gold-btn" type="button" id="verifyCode">Log in</button>
    </section>
    <p id="message" class="status"></p>

    <section class="panel" id="pack">
      <div class="run" style="padding:8px 16px 0"><div class="eyebrow">PACKING</div><h2 id="title">Ready to pack</h2></div>
      <div id="station"></div>
    </section>

    <section class="panel" id="products">
      <section class="checkout-card">
        <div class="eyebrow">PRODUCTS</div>
        <h2>Paste products</h2>
        <p>One per line: <code>Name | Category | Price | Strength</code></p>
        <textarea id="bulk" rows="8" placeholder="Daily multivitamin | General | 12 | 30 tablets"></textarea>
        <button class="gold-btn" id="bulkAdd" type="button">Add pasted products</button>
        <h2>Or add one</h2>
        <form id="add">
          <label>Name</label><input id="name" required>
          <label>Category</label><input id="category" required>
          <label>Strength</label><input id="strength" placeholder="10mg">
          <label>Price (£)</label><input id="price" type="number" min="0" step="0.01" required>
          <label>Description</label><textarea id="description"></textarea>
          <button class="gold-btn" type="submit">Add product</button>
        </form>
        <div id="list"></div>
      </section>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
