<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kage Supps</title>
  <link rel="stylesheet" href="/shop.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/shop">KAGE</a>
      <nav class="nav">
        <a href="#products">Products</a>
        <a href="#basket">Basket <span id="cartCount">0</span></a>
      </nav>
    </div>
  </header>

  <div id="gate" class="gate">
    <div class="gate-card">
      <h1>Welcome</h1>
      <p>Enter your details to browse.</p>
      <label>Full name</label>
      <input id="gateName" type="text" placeholder="Your name">
      <label>Phone</label>
      <input id="gatePhone" type="tel" placeholder="+44 7...">
      <button id="gateStart" class="btn">Send code</button>
      <label>Code</label>
      <input id="gateCode" type="text" placeholder="6 digit code">
      <button id="gateVerify" class="btn">Enter shop</button>
      <p id="gateStatus" class="status"></p>
      <hr>
      <label>Admin passkey</label>
      <input id="adminKey" type="password" placeholder="Staff passkey">
      <button id="adminLogin" class="btn btn-outline">Admin</button>
      <p id="adminStatus" class="status"></p>
    </div>
  </div>

  <main id="shop" hidden>
    <section class="intro">
      <h1>Kage Supps</h1>
      <p>Premium compounds. Crypto only.</p>
    </section>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search products">
      <div id="cats" class="cats"></div>
    </div>

    <section id="products" class="grid"></section>

    <section id="basket" class="basket">
      <h2>Basket</h2>
      <div id="basketLines">Empty</div>
      <p class="total">Total: <strong id="basketTotal">£0.00</strong></p>
      <label>Name</label>
      <input id="name" type="text">
      <label>Phone</label>
      <input id="phone" type="tel">
      <label>Address</label>
      <textarea id="address"></textarea>
      <button id="checkout" class="btn">Continue to payment</button>
      <p id="status" class="status"></p>
    </section>
  </main>
  <script src="/shop.js"></script>
</body>
</html>
