<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kage Supps</title>
  <link rel="stylesheet" href="/shop.css">
</head>
<body>
  <!-- Sign in is the first and only page until verified -->
  <div id="gate" class="gate">
    <div class="gate-inner">
      <div class="brand">KAGE</div>
      <h1>Sign in</h1>
      <p class="sub">Verify your phone to continue.</p>
      <input id="gateName" placeholder="Full name" autocomplete="name">
      <input id="gatePhone" placeholder="Phone number" autocomplete="tel">
      <button id="gateStart" class="btn" type="button">Send code</button>
      <input id="gateCode" placeholder="6-digit code">
      <button id="gateVerify" class="btn" type="button">Enter</button>
      <p id="gateStatus" class="status"></p>
      <div class="admin-link">
        <input id="adminKey" type="password" placeholder="Admin passkey">
        <button id="adminLogin" class="btn btn-ghost" type="button">Admin</button>
        <p id="adminStatus" class="status"></p>
      </div>
    </div>
  </div>

  <!-- Shop only after sign-in -->
  <div id="shop" hidden>
    <header class="header">
      <div class="wrap">
        <a class="logo" href="#">KAGE</a>
        <nav class="nav">
          <div class="drop">
            <button class="nav-btn" type="button">Products</button>
            <div class="menu" id="menu"></div>
          </div>
          <a href="#basket">Basket</a>
        </nav>
        <button class="basket-btn" type="button" onclick="document.getElementById('basket').scrollIntoView({behavior:'smooth'})">
          Basket <span id="cartCount">0</span>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="wrap">
        <h1>Kage Supps</h1>
        <p>Premium compounds · Crypto only</p>
      </div>
    </section>

    <div class="wrap">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search the collection">
      </div>
      <div id="products" class="products"></div>
    </div>

    <section id="basket" class="checkout">
      <div class="wrap narrow">
        <h2>Checkout</h2>
        <div id="basketLines" class="lines"></div>
        <p class="total">Total <strong id="basketTotal">£0.00</strong></p>
        <input id="name" placeholder="Full name">
        <input id="phone" placeholder="Phone">
        <textarea id="address" placeholder="Delivery address"></textarea>
        <button id="checkout" class="btn" type="button">Place order</button>
        <p id="status" class="status"></p>
      </div>
    </section>
  </div>
  <script src="/shop.js"></script>
</body>
</html>
