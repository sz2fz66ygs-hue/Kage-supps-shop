<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kage Supps</title>
  <link rel="stylesheet" href="/shop.css">
</head>
<body>
  <div class="top-bar">Crypto payments only</div>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="/shop">KAGE</a>
      <nav>
        <a href="#products">Shop</a>
        <a href="#basket">Basket</a>
      </nav>
      <button class="basket-btn" onclick="document.getElementById('basket').scrollIntoView()">Basket <span id="cartCount">0</span></button>
    </div>
  </header>

  <div id="gate" class="gate">
    <form class="gate-box" onsubmit="return false">
      <h2>Sign in</h2>
      <input id="gateName" placeholder="Full name" required>
      <input id="gatePhone" placeholder="Phone number" required>
      <button id="gateStart" class="btn" type="button">Send code</button>
      <input id="gateCode" placeholder="Code">
      <button id="gateVerify" class="btn" type="button">Continue</button>
      <p id="gateStatus"></p>
      <details>
        <summary>Admin</summary>
        <input id="adminKey" type="password" placeholder="Passkey">
        <button id="adminLogin" class="btn" type="button">Login</button>
        <p id="adminStatus"></p>
      </details>
    </form>
  </div>

  <div id="shop" hidden>
    <section class="banner">
      <div class="wrap">
        <h1>Kage Supps</h1>
        <p>Premium compounds · UK dispatch</p>
      </div>
    </section>

    <div class="wrap">
      <div class="filters">
        <input id="search" type="search" placeholder="Search">
        <div id="cats" class="cats"></div>
      </div>
      <div id="products" class="products"></div>
    </div>

    <section id="basket" class="checkout">
      <div class="wrap narrow">
        <h2>Checkout</h2>
        <div id="basketLines" class="lines"></div>
        <p class="total">Total <strong id="basketTotal">£0.00</strong></p>
        <input id="name" placeholder="Full name">
        <input id="phone" placeholder="Phone">
        <textarea id="address" placeholder="Delivery address"></textarea>
        <button id="checkout" class="btn">Place order</button>
        <p id="status"></p>
      </div>
    </section>
  </div>
  <script src="/shop.js"></script>
</body>
</html>
